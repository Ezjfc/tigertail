[workspace]
resolver = "2"
members = ["crates/tigertaild", "crates/tigertail-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Portable transform pipeline shared with the host-side rm-pad project.
rm-pad = { git = "https://github.com/Endermanbugzjfc/rm-pad.git", rev = "f0e3d8f5b5832ed55d32cc2754e9118a73a75194", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
evdevil = "0.4.0"
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
